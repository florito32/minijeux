<body>
<a class="skip-link" href="#contenu">Aller au contenu</a>

<!-- Barre d'onglets : un onglet par jeu (ajouter un <li> par nouveau jeu, sur chaque page) -->
<nav class="tabs" aria-label="Jeux">
  <div class="wrap">
    <a class="brand" href="../">Ludoaventura</a>
    <ul>
      <li><a class="tab" href="../multiplication/" aria-current="page"><span aria-hidden="true">✖️</span> Multiplication</a></li>
      <li><span class="tab-soon">Bientôt d'autres jeux</span></li>
    </ul>
  </div>
</nav>

<main id="contenu">
  <div class="wrap">
    <header class="page-head">
      <h1>Jeu de multiplication</h1>
      <p>Trouve le résultat, puis valide. Les tables de 1 à 10.</p>
    </header>

    <section class="game" aria-label="Partie en cours">
      <p class="score" aria-live="polite">
        Bonnes réponses : <b data-score>0</b> / <b data-total>0</b>
      </p>
      <p class="question" data-question aria-live="polite"></p>
      <form class="answer-form" data-form novalidate>
        <label class="visually-hidden" for="reponse">Ta réponse</label>
        <input id="reponse" name="reponse" type="text" inputmode="numeric" pattern="[0-9]*"
               autocomplete="off" maxlength="3" required>
        <button class="btn btn-primary" type="submit">Valider</button>
      </form>
      <p class="feedback" data-feedback role="status"></p>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <p>Ludoaventura — petits jeux pour apprendre en s'amusant.</p>
    <div data-version></div>
  </div>
</footer>

<script src="../js/multiplication.js" defer></script>
<script src="../js/version.js" defer></script>
<script src="../js/pwa.js" defer></script>
</body>
</html>
