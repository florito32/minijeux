<body class="p4-page">
<a class="skip-link" href="#contenu">Aller au contenu</a>

<!-- Barre d'onglets : un onglet par jeu (ajouter un <li> par nouveau jeu, sur chaque page) -->
<nav class="tabs" aria-label="Jeux">
  <div class="wrap">
    <a class="brand" href="../">Ludoaventura</a>
    <ul>
      <li><a class="tab" href="../multiplication/"><span aria-hidden="true">✖️</span> Multiplication</a></li>
      <li><a class="tab" href="../puissance-4/" aria-current="page"><span aria-hidden="true">🔴</span> Puissance 4</a></li>
    </ul>
  </div>
</nav>

<main id="contenu" class="p4">
  <!-- Écran d'accueil du jeu : choix du mode -->
  <section id="p4-menu" class="p4-menu" aria-labelledby="p4-menu-title">
    <div class="p4-card">
      <div class="p4-logo" aria-hidden="true">
        <span class="p4-disc p4-red"></span><span class="p4-disc p4-yellow"></span><span class="p4-disc p4-red"></span><span class="p4-disc p4-yellow"></span>
      </div>
      <h1 id="p4-menu-title">Puissance 4</h1>
      <p class="p4-tagline">Alignez 4 jetons avant votre adversaire.</p>

      <div class="p4-mode">
        <h2>Contre l'ordinateur</h2>
        <fieldset class="p4-levels">
          <legend class="visually-hidden">Niveau</legend>
          <label><input type="radio" name="p4-level" id="p4-level-facile" value="facile"><span>Facile</span></label>
          <label><input type="radio" name="p4-level" id="p4-level-moyen" value="moyen" checked><span>Moyen</span></label>
          <label><input type="radio" name="p4-level" id="p4-level-difficile" value="difficile"><span>Difficile</span></label>
        </fieldset>
        <button type="button" class="btn btn-primary" id="p4-start-solo">Jouer contre l'ordinateur</button>
      </div>

      <div class="p4-divider"><span>ou</span></div>

      <button type="button" class="btn p4-btn-secondary" id="p4-start-duo">Jouer à deux sur ce téléphone</button>
      <button type="button" class="p4-link" id="p4-resume" hidden>Reprendre la partie en cours</button>
    </div>
  </section>

  <!-- Écran de jeu -->
  <section id="p4-game" class="p4-game" aria-labelledby="p4-game-title" hidden>
    <div class="p4-header">
      <button type="button" class="p4-icon-btn" id="p4-back" aria-label="Retour au choix du mode">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="p4-game-title" class="visually-hidden">Puissance 4</h1>
      <div class="p4-scoreboard" aria-label="Scores">
        <div class="p4-score p4-side-1" id="p4-score-1"><span class="p4-disc p4-red" aria-hidden="true"></span><span class="p4-name" id="p4-name-1">Rouge</span><strong class="p4-pts" id="p4-pts-1">0</strong></div>
        <div class="p4-score p4-side-2" id="p4-score-2"><strong class="p4-pts" id="p4-pts-2">0</strong><span class="p4-name" id="p4-name-2">Jaune</span><span class="p4-disc p4-yellow" aria-hidden="true"></span></div>
      </div>
      <span class="p4-badge" id="p4-mode-badge"></span>
    </div>

    <p class="p4-status" id="p4-status" role="status" aria-live="polite"></p>

    <div class="p4-board" id="p4-board" role="group" aria-label="Plateau de jeu, 7 colonnes"></div>

    <button type="button" class="btn btn-primary p4-replay" id="p4-replay">Nouvelle partie</button>
  </section>
</main>
